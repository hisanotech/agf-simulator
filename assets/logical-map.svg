<text x="530" y="510" class="sm">停止座標は未確定</text>
<line x1="590" y1="520" x2="590" y2="563" class="unk"/>
<path d="M331 567 V708" class="unk" marker-end="url(#arrow)"/><path d="M356 567 V708" class="unk" marker-start="url(#arrow)"/>
<path d="M811 567 V708" class="unk" marker-start="url(#arrow)"/><path d="M836 567 V708" class="unk" marker-end="url(#arrow)"/>
<line x1="349" y1="584" x2="820" y2="584" class="cross" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="349" y1="692" x2="820" y2="692" class="cross" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="564" y="566" width="58" height="30" rx="4" class="gate"/><text x="572" y="585" class="sm">防火SH</text>
<rect x="564" y="676" width="58" height="30" rx="4" class="gate"/><text x="572" y="695" class="sm">防火SH</text>
<text x="267" y="637" class="label" transform="rotate(-90 267 637)">西主通路：保管側 ↓ ／ 壁側 ↑</text>
<text x="880" y="636" class="label" transform="rotate(-90 880 636)">東主通路：保管側 ↓ ／ 壁側 ↑</text>
<text x="590" y="575" text-anchor="middle" class="sm">上段・下段接続：双方向2車線</text>
<line x1="338" y1="633" x2="180" y2="633" stroke="#7f7fb5" stroke-width="4" stroke-dasharray="6 5"/>
<line x1="828" y1="633" x2="1007" y2="633" stroke="#7f7fb5" stroke-width="4" stroke-dasharray="6 5"/>
<text x="92" y="621" class="sm">保管アクセス：</text><text x="92" y="637" class="sm">各双方向1車線</text>
<text x="980" y="621" class="sm">保管アクセス：</text><text x="980" y="637" class="sm">各双方向1車線</text>
<rect x="440" y="617" width="290" height="40" rx="8" class="box"/>
<text x="585" y="632" text-anchor="middle" class="sm">横1行：双方向1車線・横並び通過禁止</text>
<text x="585" y="647" text-anchor="middle" class="sm">行ごとの接続・停止点は未確定</text>
<text x="576" y="746" class="sm" text-anchor="middle">同じ行の既存置きタスク中は新規02を発行保留。02発行時に搬送先ロケーションを予約。</text>
<rect x="26" y="783" width="18" height="9" fill="#2563eb"/><text x="51" y="792" class="sm">確認済みの概念接続</text>
<line x1="289" y1="789" x2="336" y2="789" class="unk"/><text x="343" y="792" class="sm">具体的な取付け・経路未確定</text>
<text x="1150" y="792" text-anchor="end" class="note">DO NOT USE FOR DISTANCE / ETA / SAFETY</text>
<rect x="26" y="817" width="1128" height="194" rx="12" class="area"/>
<text x="45" y="842" class="label">EB2南側設備（相対配置のみ・個別座標未確認）</text>
<text x="45" y="865" class="sm">東側主通路2本からのアクセスは確認済み。個別の分岐・停止位置は未確定。</text>
<rect x="51" y="881" width="300" height="52" rx="5" class="box"/><text x="70" y="913" class="label">待機場所①・②（左寄り・上）</text>
<rect x="51" y="944" width="300" height="49" rx="5" class="box"/><text x="70" y="974" class="label">充電場所①・②（待機場所の下）</text>
<rect x="387" y="881" width="695" height="52" rx="5" class="box"/><text x="408" y="913" class="label">空パレット整列機① ② ③ ④ ⑤（右寄り・横並び）</text>
<rect x="387" y="944" width="695" height="49" rx="5" fill="#fff1f2" stroke="#bb3944"/><text x="408" y="974" class="label">空パレ置き場：AGF進入禁止・有人供給元（整列機の下）</text>
