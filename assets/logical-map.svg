<text x="52" y="213" class="sm">西側入口</text><text x="52" y="229" class="sm">進入のみ</text>
<line x1="130" y1="218" x2="147" y2="218" class="unk"/>
<rect x="984" y="193" width="130" height="51" rx="6" class="gate"/>
