<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1040" role="img" aria-label="AGF論理マップ概念図。実座標・寸法を表していません">
<title>AGF 論理マップ（概念図、実寸法ではありません）</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
  <style>
  .title{font:700 26px sans-serif;fill:#132b45}.sub{font:14px sans-serif;fill:#4c6175}.area{fill:#f4f8fc;stroke:#a7bfd8;stroke-width:2}.wh{fill:#fff9f4;stroke:#ddbfa7;stroke-width:2}.rail{stroke:#2563eb;stroke-width:7;stroke-linecap:round}.cross{stroke:#0d9488;stroke-width:5;stroke-linecap:round}.unk{stroke:#c2782a;stroke-width:3;stroke-dasharray:9 7}.label{font:700 15px sans-serif;fill:#18334c}.sm{font:12px sans-serif;fill:#445569}.note{font:12px sans-serif;fill:#944a19}.box{fill:#fff;stroke:#a4bdd3;stroke-width:1.5}.gate{fill:#b9ccdf;stroke:#56718b;stroke-width:1.5}.forbid{stroke:#bb3944;stroke-width:5}
  </style>
</defs>
<rect width="1180" height="1040" fill="white"/>
<text x="32" y="39" class="title">AGF 論理マップ（公開用概念図）</text>
<text x="32" y="61" class="sub">経路接続と区間の区別を示す模式図。座標・縮尺・車体のすれ違い余裕・確定所要時間を表すものではありません。</text>
