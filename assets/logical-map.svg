<line x1="150" y1="218" x2="955" y2="218" class="rail" marker-start="url(#arrow)"/>
<line x1="150" y1="293" x2="955" y2="293" class="rail" marker-end="url(#arrow)"/>
<line x1="150" y1="218" x2="150" y2="293" class="cross"/>
<line x1="955" y1="218" x2="955" y2="293" class="cross"/>
<path d="M245 218 V293 M356 218 V293 M467 218 V293 M578 218 V293 M689 218 V293 M800 218 V293 M880 218 V293" class="cross" opacity=".5"/>
<line x1="356" y1="168" x2="356" y2="213" class="cross"/>
<text x="420" y="208" class="label">PZ-A1：北側論理レーン ← 東から西</text>
<text x="420" y="284" class="label">PZ-A2：南側論理レーン → 西から東</text>
<text x="102" y="321" class="sm">共有走行空間</text>
<text x="850" y="321" class="sm">設備前・入口・出口で合流</text>
<text x="550" y="343" text-anchor="middle" class="sm">同一走行空間の対向2論理レーン。物理分離・両端だけの接続・入口後の左迂回は設けない。</text>
